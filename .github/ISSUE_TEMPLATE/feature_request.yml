name: Feature Request
description: Suggest something new or an improvement to an existing feature.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Help us understand what you want and why.
  - type: input
    id: portal-area
    attributes:
      label: Where in the portal would this live?
      placeholder: "e.g. DJ Profile, Curation Desk, Invitations"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in and what's frustrating about it today.
      placeholder: "When I'm reviewing submissions, I have to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the change or feature in your own words. It's fine if you're not sure how it should work — just describe what you want to be able to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      placeholder: "I tried doing X but it doesn't work because..."
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - "Nice to have"
        - "Would meaningfully improve my workflow"
        - "Currently blocking how I want to use the portal"
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this isn't a duplicate.
          required: true
